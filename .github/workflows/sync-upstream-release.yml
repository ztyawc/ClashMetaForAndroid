name: Sync upstream and release special APK

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      prerelease:
        description: Build main and replace the special-Prerelease-alpha prerelease
        type: boolean
        default: false

permissions: {}

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: MetaCubeX/ClashMetaForAndroid
  KERNEL_REPOSITORY: ztyawc/mihomo
  PACKAGE_ID: com.github.metacubex.clash.ztyawc
  KERNEL_PATH: core/src/foss/golang/clash

jobs:
  sync:
    name: Synchronize sources
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      apk_name: ${{ steps.release.outputs.apk_name }}
      app_version: ${{ steps.release.outputs.app_version }}
      kernel_sha: ${{ steps.release.outputs.kernel_sha }}
      release_kind: ${{ steps.release.outputs.release_kind }}
      release_title: ${{ steps.release.outputs.release_title }}
      should_release: ${{ steps.release.outputs.should_release }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      special_tag: ${{ steps.release.outputs.special_tag }}
      upstream_sha: ${{ steps.release.outputs.upstream_sha }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
    steps:
      - name: Checkout special edition
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream and select latest custom kernel
        run: |
          set -euo pipefail

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          fi
          git fetch --no-tags upstream main

          set +e
          git merge --no-edit upstream/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            while IFS= read -r conflicted_path; do
              case "$conflicted_path" in
                .gitmodules|"$KERNEL_PATH"|\
                .github/workflows/build-debug.yaml|\
                .github/workflows/build-pre-release.yaml|\
                .github/workflows/build-release.yaml|\
                .github/workflows/update-dependencies.yaml|\
                core/src/foss/golang/go.mod|\
                core/src/foss/golang/go.sum|\
                core/src/main/golang/go.mod|\
                core/src/main/golang/go.sum)
                  ;;
                *)
                  echo "Manual merge required for: $conflicted_path" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U)

            if git diff --name-only --diff-filter=U | grep -Fxq .gitmodules; then
              git checkout --ours -- .gitmodules
            fi
            for generated_module_file in \
              core/src/foss/golang/go.mod \
              core/src/foss/golang/go.sum \
              core/src/main/golang/go.mod \
              core/src/main/golang/go.sum; do
              if git diff --name-only --diff-filter=U | \
                grep -Fxq "$generated_module_file"; then
                # The next step regenerates these files from the selected custom kernel.
                git checkout --ours -- "$generated_module_file"
                git add "$generated_module_file"
              fi
            done
            git rm -f --ignore-unmatch \
              .github/workflows/build-debug.yaml \
              .github/workflows/build-pre-release.yaml \
              .github/workflows/build-release.yaml \
              .github/workflows/update-dependencies.yaml
          fi

          git config -f .gitmodules submodule.clash-foss.url \
            "https://github.com/${KERNEL_REPOSITORY}"
          git config -f .gitmodules submodule.clash-foss.branch main

          kernel_sha="$(git ls-remote "https://github.com/${KERNEL_REPOSITORY}.git" \
            refs/heads/main | awk '{print $1}')"
          test -n "$kernel_sha"
          git update-index --add --cacheinfo "160000,$kernel_sha,$KERNEL_PATH"
          git submodule sync -- "$KERNEL_PATH"
          git submodule update --init --force "$KERNEL_PATH"
          git -C "$KERNEL_PATH" fetch origin +main:refs/remotes/origin/main
          git -C "$KERNEL_PATH" checkout --detach "$kernel_sha"

          git add .gitmodules "$KERNEL_PATH"
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
            git commit --no-edit
          fi

          {
            echo "KERNEL_SHA=$kernel_sha"
            echo "KERNEL_SHORT_SHA=${kernel_sha:0:12}"
            echo "UPSTREAM_SHA=$(git rev-parse upstream/main)"
          } >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            core/src/foss/golang/go.sum
            core/src/main/golang/go.sum

      - name: Synchronize Go module dependencies
        run: |
          set -euo pipefail
          go install github.com/metacubex/update-go-mod-replace@latest

          pushd core/src/foss/golang >/dev/null
          update-go-mod-replace "$GITHUB_WORKSPACE/$KERNEL_PATH/go.mod" "$PWD/go.mod"
          go mod tidy
          popd >/dev/null

          pushd core/src/main/golang >/dev/null
          update-go-mod-replace "$GITHUB_WORKSPACE/$KERNEL_PATH/go.mod" "$PWD/go.mod"
          go mod tidy
          popd >/dev/null

      - name: Commit synchronized custom kernel
        run: |
          set -euo pipefail
          git add .gitmodules "$KERNEL_PATH" \
            core/src/foss/golang/go.mod core/src/foss/golang/go.sum \
            core/src/main/golang/go.mod core/src/main/golang/go.sum
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ztyawc mihomo to ${KERNEL_SHORT_SHA}"
          fi

      - name: Push synchronized sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin HEAD:main

      - name: Determine whether a release is required
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease == true }}
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' \
            build.gradle.kts | head -n1)"
          source_sha="$(git rev-parse HEAD)"

          if [[ "$PRERELEASE" == true ]]; then
            # A manual prerelease always builds the synchronized main, whatever
            # the latest upstream stable release is.
            {
              echo "apk_name=CMFA-${app_version}-prerelease-${source_sha:0:8}-ztyawc-special-arm64-v8a-unsigned"
              echo "app_version=$app_version"
              echo "kernel_sha=$KERNEL_SHA"
              echo "release_kind=prerelease"
              echo "release_title=CMFA 特供版 Prerelease-alpha"
              echo "should_release=true"
              echo "source_sha=$source_sha"
              echo "special_tag=special-Prerelease-alpha"
              echo "upstream_sha=$UPSTREAM_SHA"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream_tag=""
          for attempt in 1 2 3 4 5; do
            candidate=""
            if candidate="$(gh api \
              "repos/${UPSTREAM_REPOSITORY}/releases/latest" \
              --jq '.tag_name // empty')" && \
              [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              upstream_tag="$candidate"
              break
            fi

            echo "Latest upstream release lookup attempt ${attempt}/5 failed or returned an invalid tag." >&2
            if (( attempt < 5 )); then
              sleep $((attempt * 3))
            fi
          done
          if [[ -z "$upstream_tag" ]]; then
            echo "Unable to determine a valid latest upstream release after 5 attempts." >&2
            exit 1
          fi

          special_tag="special-${upstream_tag}"
          should_release=true

          if [[ "v${app_version}" != "$upstream_tag" ]]; then
            echo "main is v${app_version}, latest stable release is ${upstream_tag}; sync only."
            should_release=false
          else
            release_exists=false
            release_error="$RUNNER_TEMP/release-lookup-error.txt"
            for attempt in 1 2 3 4 5; do
              release_candidate=""
              if release_candidate="$(gh api \
                "repos/${GITHUB_REPOSITORY}/releases/tags/${special_tag}" \
                --jq '.tag_name // empty' 2>"$release_error")"; then
                if [[ "$release_candidate" == "$special_tag" ]]; then
                  release_exists=true
                  break
                fi
                echo "Special release lookup attempt ${attempt}/5 returned an invalid tag." >&2
              elif grep -Fq '(HTTP 404)' "$release_error"; then
                break
              else
                echo "Special release lookup attempt ${attempt}/5 failed:" >&2
                sed -n '1,5p' "$release_error" >&2
              fi

              if (( attempt == 5 )); then
                echo "Unable to determine whether $special_tag is published." >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done

            if [[ "$release_exists" == true ]]; then
              echo "$special_tag is already published; sync only."
              should_release=false
            fi
          fi

          {
            echo "apk_name=CMFA-${app_version}-ztyawc-special-arm64-v8a-unsigned"
            echo "app_version=$app_version"
            echo "kernel_sha=$KERNEL_SHA"
            echo "release_kind=stable"
            echo "release_title=CMFA 特供版 ${upstream_tag}"
            echo "should_release=$should_release"
            echo "source_sha=$source_sha"
            echo "special_tag=$special_tag"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "upstream_tag=$upstream_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify unsigned arm64 APK
    needs: sync
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout synchronized source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.sync.outputs.source_sha }}
          submodules: false

      - name: Checkout custom kernel
        run: |
          set -euo pipefail
          git submodule sync -- "$KERNEL_PATH"
          git submodule update --init --force "$KERNEL_PATH"
          git -C "$KERNEL_PATH" fetch origin +main:refs/remotes/origin/main
          test "$(git -C "$KERNEL_PATH" rev-parse HEAD)" = "${{ needs.sync.outputs.kernel_sha }}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            core/src/foss/golang/go.sum
            core/src/main/golang/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Android native toolchain
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Apply CMFA Go runtime patches
        run: |
          set -euo pipefail
          for patch_file in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch --verbose -d "$(go env GOROOT)" -p1 < "$patch_file"
          done

      - name: Prepare reproducible build inputs
        run: |
          set -euo pipefail
          cp -f /etc/ssl/certs/ca-certificates.crt \
            "$KERNEL_PATH/component/ca/ca-certificates.crt"
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "custom.application.id=${PACKAGE_ID}"
            echo "remove.suffix=true"
          } > local.properties

      - name: Test custom mihomo kernel
        working-directory: core/src/foss/golang/clash
        run: go test -tags with_gvisor ./transport/socks5 ./adapter/outbound

      - name: Build unsigned arm64 Meta APK
        run: >-
          ./gradlew --no-daemon app:assembleMetaRelease
          -Pandroid.injected.build.abi=arm64-v8a

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          source_apk="$(find app/build -type f -path '*/apk/*' \
            -name '*arm64-v8a*release-unsigned.apk' -print -quit)"
          test -n "$source_apk"

          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$aapt" dump badging "$source_apk" | grep -F "package: name='${PACKAGE_ID}'"
          "$aapt" dump badging "$source_apk" | \
            grep -F "application-label:'Clash Meta for Android（特供版）'"
          test "$(unzip -Z1 "$source_apk" | awk -F/ '/^lib\// {print $2}' | sort -u)" = \
            "arm64-v8a"
          unzip -Z1 "$source_apk" | grep -Fx 'lib/arm64-v8a/libclash.so'
          unzip -Z1 "$source_apk" | grep -Fx 'lib/arm64-v8a/libbridge.so'
          kernel_short="${{ needs.sync.outputs.kernel_sha }}"
          kernel_short="${kernel_short:0:7}"
          unzip -p "$source_apk" lib/arm64-v8a/libbridge.so | strings | \
            grep -F "$kernel_short"
          if "$apksigner" verify --verbose "$source_apk"; then
            echo "APK unexpectedly contains a signature" >&2
            exit 1
          fi
          if unzip -Z1 "$source_apk" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo "APK unexpectedly contains a JAR signature" >&2
            exit 1
          fi
          unzip -t "$source_apk" >/dev/null

          mkdir -p dist
          output_apk="dist/${{ needs.sync.outputs.apk_name }}.apk"
          cp -f "$source_apk" "$output_apk"
          sha256sum "$output_apk"

      - name: Upload verified APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.sync.outputs.apk_name }}
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs:
      - sync
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sync.outputs.apk_name }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_SHA: ${{ needs.sync.outputs.kernel_sha }}
          RELEASE_KIND: ${{ needs.sync.outputs.release_kind }}
          RELEASE_TITLE: ${{ needs.sync.outputs.release_title }}
          SOURCE_SHA: ${{ needs.sync.outputs.source_sha }}
          SPECIAL_TAG: ${{ needs.sync.outputs.special_tag }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.sync.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          apk_path="$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          checksum="$(sha256sum "$apk_path" | awk '{print $1}')"
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            if [[ "$RELEASE_KIND" == prerelease ]]; then
              echo "Clash Meta for Android（特供版）预发布版"
              echo
              echo "- 源码：\`${GITHUB_REPOSITORY}@${SOURCE_SHA}\`"
              echo "- CMFA 上游 main：\`${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}\`"
            else
              echo "Clash Meta for Android（特供版）"
              echo
              echo "- CMFA 上游版本：\`${UPSTREAM_TAG}\`"
            fi
            echo "- 魔改内核：\`${KERNEL_REPOSITORY}@${KERNEL_SHA}\`"
            echo "- 包名：\`${PACKAGE_ID}\`"
            echo "- ABI：\`arm64-v8a\`"
            echo "- SHA-256：\`${checksum}\`"
            echo
            if [[ "$RELEASE_KIND" == prerelease ]]; then
              echo "> 预发布版基于 main 的最新代码构建，未经上游正式发布；与正式特供版包名相同，安装会覆盖正式版。"
              echo ">"
            fi
            echo "> APK 未签名，必须自行签名后才能安装。"
          } > "$notes_file"

          special_tag="$SPECIAL_TAG"
          release_exists=false
          release_error="$RUNNER_TEMP/release-lookup-error.txt"
          for attempt in 1 2 3 4 5; do
            release_candidate=""
            if release_candidate="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${special_tag}" \
              --jq '.tag_name // empty' 2>"$release_error")"; then
              if [[ "$release_candidate" == "$special_tag" ]]; then
                release_exists=true
                break
              fi
              echo "Release lookup attempt ${attempt}/5 returned an invalid tag." >&2
            elif grep -Fq '(HTTP 404)' "$release_error"; then
              break
            else
              echo "Release lookup attempt ${attempt}/5 failed:" >&2
              sed -n '1,5p' "$release_error" >&2
            fi

            if (( attempt == 5 )); then
              echo "Unable to determine whether $special_tag already exists." >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

          prerelease_flags=()
          if [[ "$RELEASE_KIND" == prerelease ]]; then
            # Like upstream's Prerelease-alpha, each prerelease replaces the previous one.
            if [[ "$release_exists" == true ]]; then
              gh release delete "$special_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
            # A leftover tag would make the new release ignore --target.
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${special_tag}" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${special_tag}"
            fi
            prerelease_flags=(--prerelease)
          elif [[ "$release_exists" == true ]]; then
            echo "Release already exists; nothing to publish."
            exit 0
          fi
          gh release create "$special_tag" "$apk_path" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$notes_file" \
            "${prerelease_flags[@]}"
